function size(){
  const vw=innerWidth,vh=innerHeight;
  const fs=20+n*9,padY=10+n*5,padX=26+n*11;
  yes.style.fontSize=fs+'px';yes.style.padding=padY+'px '+padX+'px';
  const r=yes.getBoundingClientRect();
  if(r.width>=vw*0.92||r.height>=vh*0.92||n>=18){yes.classList.add('max');yes.style.fontSize='';yes.style.padding='';no.style.display='none';note.style.display='none'}
}
no.addEventListener('click',()=>{if(done)return;n++;note.textContent=lines[(n-1)%lines.length];no.style.fontSize=Math.max(8,18-n)+'px';no.style.padding=Math.max(3,8-n/2)+'px '+Math.max(8,22-n)+'px';size();bonk()});
yes.addEventListener('click',()=>{if(done)return;done=true;celebrate()});
addEventListener('resize',()=>{if(!done&&n>0)size()});
// sound (synthesized)
let ac;function ctx(){return ac||(ac=new (window.AudioContext||window.webkitAudioContext)())}
function tone(f,t0,d,type='square',v=.15){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.02)}
function bonk(){try{tone(220-n*6,0,.15,'sawtooth',.12)}catch(e){}}
function fanfare(){try{
  const m=[523,659,784,1047,784,1047,1319,1047,1319,1568];
  m.forEach((f,i)=>tone(f,i*.14,.3,'square',.14));
  [262,330,392,523].forEach((f,i)=>tone(f,i*.35,.5,'triangle',.18));
  for(let i=0;i<8;i++)tone(1800+Math.random()*1500,1.5+i*.08,.12,'sine',.08);
  tone(1568,1.5,1.2,'square',.12);tone(1047,1.5,1.2,'triangle',.16);
}catch(e){}}
// confetti
function celebrate(){
  win.classList.add('on');fanfare();
  const c=cv,x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff2bd6','#b6ff00','#00f0ff','#fff200','#ff3b3b','#fff'];
  const ps=Array.from({length:220},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,r:5+Math.random()*9,vx:-2+Math.random()*4,vy:2+Math.random()*5,a:Math.random()*6,va:-.2+Math.random()*.4,c:cols[Math.random()*cols.length|0]}));
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;if(p.y>c.height+20){p.y=-20;p.x=Math.random()*c.width}
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(done)timer=requestAnimationFrame(f)
  })();
}
document.getElementById('again').addEventListener('click',()=>{done=false;cancelAnimationFrame(timer);win.classList.remove('on');n=0;yes.classList.remove('max');yes.style.fontSize='';yes.style.padding='';no.style.display='';no.style.fontSize='';no.style.padding='';note.style.display='';note.textContent='Choose wisely bestie 💅'});
</script>
</body>
